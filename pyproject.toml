[project]
name = "log-c2-029"
version = "0.1.0"
description = "LogisticsPolicyQAAgent — AgentCore Template"
requires-python = ">=3.11"
# The framework (agenticstar-agentcore) is NOT a public-PyPI dependency; CI
# installs it from an internal package index. Pinning it here would make
# `pip install -e .` fail because it is not resolvable from the default index.
# pyyaml is a real runtime dependency: PB-7 imports it to read config/config.yaml
# when checking hitl.enabled.
dependencies = [
    "agenticstar-agentcore[marketplace,openai]==1.0.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.1.1",
    "pytest-cov==5.0.0",
    "pytest-asyncio==0.23.6",
    "ruff==0.4.4",
    "mypy==1.10.0",
    "types-PyYAML==6.0.12.20260815",
]

[build-system]
requires = ["setuptools==68.2.2"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
# The published agenticstar-agentcore wheel ships no py.typed marker, so
# framework.* / shared.* imports resolve as Any — which would make every
# required framework subclass an error on its own. All other strict settings
# stay on.
disallow_subclassing_any = false

[[tool.mypy.overrides]]
module = ["framework.*", "shared.*", "langgraph.*"]
ignore_missing_imports = true
